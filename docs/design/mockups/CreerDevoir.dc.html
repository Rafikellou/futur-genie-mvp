<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un devoir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#B8205F}a:hover{color:#8E1648}</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F5F6FD; font-family: 'DM Sans', system-ui, sans-serif; color: #141A46">
  <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; left: -130px; top: -110px; border-radius: 50%; background: #5B6CFF; opacity: 0.35; filter: blur(80px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; right: -150px; top: 380px; border-radius: 50%; background: #F0458A; opacity: 0.25; filter: blur(90px)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 18px; padding: 60px 22px 130px 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Clair.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95); color: #3140D6; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Retour</a>
      <span style="font-size: 13px; font-weight: 600; color: #555B80">Étape 1 sur 3</span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div style="height: 5px; border-radius: 3px; background: linear-gradient(90deg, #3B4CF0, #7B2FE0)"></div>
      <div style="height: 5px; border-radius: 3px; background: #DCE0F2"></div>
      <div style="height: 5px; border-radius: 3px; background: #DCE0F2"></div>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Créer un devoir</h1>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <fieldset style="margin: 0; padding: 18px; border: 1px solid rgba(255,255,255,0.95); border-radius: 24px; background: rgba(255,255,255,0.72)">
        <legend style="float: left; width: 100%; padding: 0; margin-bottom: 12px; font-size: 14px; font-weight: 600">{{g.label}}</legend>
        <div style="clear: both; display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{g.options}}" as="o" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{o.pressed}}" style="height: 44px; padding: 0 18px; border-radius: 22px; border: {{o.border}}; background: {{o.bg}}; color: {{o.color}}; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: {{o.weight}}">{{o.label}}</button>
          </sc-for>
        </div>
      </fieldset>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 22px 34px 22px; background: linear-gradient(180deg, rgba(245,246,253,0) 0%, #F5F6FD 35%)">
    <a href="PhotoChoix.dc.html" style="height: 58px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(90deg, #D9286E 0%, #8B2FE0 100%); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px; box-shadow: 0 12px 26px rgba(217,40,110,0.28)">
      Continuer
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => on
      ? { label, pressed: 'true', bg: 'linear-gradient(90deg, #3B4CF0, #7B2FE0)', color: '#FFFFFF', border: 'none', weight: 600 }
      : { label, pressed: 'false', bg: '#FFFFFF', color: '#141A46', border: '1px solid #DCE0F2', weight: 500 };
    const group = (label, opts, sel) => ({ label, options: opts.map((o) => chip(o, o === sel)) });
    return {
      groups: [
        group('Niveau', ['CP', 'CE1', 'CE2', 'CM1', 'CM2'], 'CE2'),
        group('Matière', ['Français', 'Mathématiques', 'Histoire', 'Géographie', 'Sciences', 'Anglais', 'Autre'], 'Sciences'),
        group('Type d’exercice', ['QCM', 'Vrai / Faux', 'Texte à trous', 'Mixte'], 'Mixte'),
        group('Nombre de questions', ['5', '10', '15'], '10')
      ]
    };
  }
}
</script>
</body>
</html>
