<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes devoirs</title>

<body>
<x-dc>
<helmet>

<style>body{margin:0}a{color:#B8205F}a:hover{color:#8E1648}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6FD; font-family: 'DM Sans', system-ui, sans-serif; color: #141A46">

  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; right: -140px; top: 260px; border-radius: 50%; background: #F0458A; opacity: 0.28; filter: blur(90px)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 60px 22px 0 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Mes devoirs</h1>

        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 14v5h14v-5"></path></svg>
        Partager plusieurs
      </a>
    </div>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 4px 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #555B80">{{d.label}}</h2>
        <sc-for list="{{d.items}}" as="item" hint-placeholder-count="2">
          <a href="DevoirPublie.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 18px; text-decoration: none; color: #141A46; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.95)">
            <div style="flex: none; width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: {{item.tint}}; color: {{item.ink}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px">{{item.abbr}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{item.title}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555B80">
                <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; background: #E5F5EC; color: #1C6B40; font-size: 12px; font-weight: 600">Publié</span>
                {{item.meta}}
              </span>
            </div>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A80A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 28px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 12px 30px rgba(20,26,70,0.14)">
    <a href="Clair.dc.html" aria-label="Accueil" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg></a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 23px; background: linear-gradient(90deg, #3B4CF0, #7B2FE0); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg>Mes devoirs</a>
    <a href="Suggestions.dc.html" aria-label="Suggestions" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg></a>
    <a href="Profil.dc.html" aria-label="Profil" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const geo = { abbr: 'GÉO', tint: '#E3E7FF', ink: '#3140D6' };
    const sci = { abbr: 'SCI', tint: '#FBE1EE', ink: '#A11E58' };
    return {
      days: [
        { label: 'Aujourd’hui', items: [
          { ...sci, title: 'Les états de l’eau', meta: 'CE2 · 10 questions' }

        { label: 'Mercredi 7 octobre', items: [
          { ...geo, title: 'Les repères sur le planisphère', meta: 'CE2 · 10 questions' },
          { ...geo, title: 'Se repérer dans l’espace', meta: 'CE2 · 5 questions' },
          { ...geo, title: 'Le globe terrestre et ses grandes lignes imaginaires', meta: 'CE2 · 10 questions' }
        ] }
      ]
    };
  }
}
</script>
