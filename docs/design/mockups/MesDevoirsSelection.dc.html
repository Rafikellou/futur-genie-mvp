<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes devoirs – sélection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">

</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6FD; font-family: 'DM Sans', system-ui, sans-serif; color: #141A46">
  <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; left: -130px; top: -110px; border-radius: 50%; background: #5B6CFF; opacity: 0.35; filter: blur(80px)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 60px 22px 0 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Mes devoirs</h1>
      <a href="MesDevoirs.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95); color: #3140D6; text-decoration: none; font-size: 14px; font-weight: 600">Annuler</a>

    <p style="margin: 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: rgba(59,76,240,0.08); font-size: 14px; line-height: 1.45; color: #2A3290">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.5v.01"></path></svg>
      Cochez les devoirs à envoyer, puis partagez-les en un seul message.
    </p>

    <h2 style="margin: 4px 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #555B80">Mercredi 7 octobre</h2>
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 18px; background: {{item.bg}}; border: {{item.border}}; cursor: pointer">
        <span style="flex: none; width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: {{item.boxBg}}; border: {{item.boxBorder}}; color: #FFFFFF">
          <sc-if value="{{item.checked}}" hint-placeholder-val="{{ true }}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
        </span>
        <input type="checkbox" aria-label="{{item.title}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{item.title}}</span>
          <span style="font-size: 13px; color: #555B80">Publié · CE2 · Géographie</span>
        </span>
      </label>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 104px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 24px; background: #141A46; box-shadow: 0 16px 34px rgba(20,26,70,0.3)">

      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 14v5h14v-5"></path></svg>
      Partager la sélection
    </a>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 28px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 12px 30px rgba(20,26,70,0.14)">
    <a href="Clair.dc.html" aria-label="Accueil" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg></a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 23px; background: linear-gradient(90deg, #3B4CF0, #7B2FE0); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg>Mes devoirs</a>
    <a href="Suggestions.dc.html" aria-label="Suggestions" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg></a>
    <a href="Profil.dc.html" aria-label="Profil" style="width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; color: #555B80"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { checked: true, bg: 'rgba(255,255,255,0.92)', border: '1.5px solid #7B2FE0', boxBg: 'linear-gradient(135deg, #3B4CF0, #7B2FE0)', boxBorder: 'none' };
    const off = { checked: false, bg: 'rgba(255,255,255,0.72)', border: '1px solid rgba(255,255,255,0.95)', boxBg: '#FFFFFF', boxBorder: '1.5px solid #B9BED6' };
    return {
      items: [
        { ...on, title: 'Les repères sur le planisphère' },
        { ...off, title: 'Se repérer dans l’espace' },
        { ...on, title: 'Le globe terrestre et ses grandes lignes imaginaires' },
        { ...off, title: 'La géographie et les grands repères de la Terre' }
      ]
    };
  }
}
