<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réponses des élèves</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#B8205F}a:hover{color:#8E1648}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6FD; font-family: 'DM Sans', system-ui, sans-serif; color: #141A46">
  <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; left: -130px; top: -110px; border-radius: 50%; background: #5B6CFF; opacity: 0.35; filter: blur(80px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; right: -150px; top: 380px; border-radius: 50%; background: #F0458A; opacity: 0.24; filter: blur(90px)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 60px 22px 30px 22px">
    <a href="DevoirPublie.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95); color: #3140D6; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Retour</a>
    <div>
      <p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #555B80">Réponses des élèves</p>
      <h1 style="margin: 4px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.1">Les états de l’eau</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95)">
      <span style="flex: none; width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #E3E7FF, #FBE1EE); color: #3140D6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 15c2 .6 3.3 2.2 3.8 5"></path></svg></span>
      <span style="font-size: 15px; font-weight: 600">5 élèves ont fait ce devoir</span>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.95)">
        <div style="flex: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #E3E7FF; color: #3140D6; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">{{r.initial}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 13px; color: #555B80">{{r.date}}</span>
          <div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #ECEEF7; overflow: hidden"><div style="height: 100%; width: {{r.pct}}; border-radius: 3px; background: linear-gradient(90deg, #3B4CF0, #7B2FE0)"></div></div>
        </div>
        <span style="flex: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #141A46">{{r.score}}</span>
      </div>
    </sc-for>

    <button type="button" style="align-self: center; margin-top: 8px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border: none; background: transparent; color: #A3251F; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>
      Supprimer ce devoir
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, c, t, date) => ({
      name, initial: name[0], date, score: c + ' / ' + t,
      pct: Math.round((c / t) * 100) + '%'
    });
    return {
      rows: [
        row('Lucas', 3, 10, '08/10 · 17:42'),
        row('Inès', 4, 10, '08/10 · 18:05'),
        row('Nathan', 7, 10, '08/10 · 17:20'),
        row('Chloé', 9, 10, '08/10 · 16:58'),
        row('Adam', 10, 10, '08/10 · 19:11')
      ]
    };
  }
}
</script>
</body>
</html>
