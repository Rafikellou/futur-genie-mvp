<!-- Supabase Auth "Confirm signup" template. Subject: Confirmez votre adresse e-mail – Futur Génie
     Not applied automatically to the hosted project: paste it into
     Dashboard > Authentication > Emails > Confirm signup (see supabase/README.md). -->
<div style="background:#F5F6FD;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:32px 28px;border:1px solid #DCE0F2;">
    <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#7B2FE0;">Futur Génie</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#141A46;">Bienvenue&nbsp;!</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#33395F;">
      Il ne reste qu'une étape&nbsp;: confirmez votre adresse e-mail pour commencer à créer vos devoirs.
    </p>
    <p style="margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7B2FE0;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600;padding:14px 24px;border-radius:14px;">Confirmer mon adresse</a>
    </p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#7A80A3;">
      Vous n'êtes pas à l'origine de cette inscription&nbsp;? Ignorez simplement cet e-mail.
    </p>
  </div>
</div>
