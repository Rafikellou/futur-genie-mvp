<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Politique de confidentialité</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#B8205F}a:hover{color:#8E1648}</style>
</helmet>
<div style="position: relative; width: 390px; height: 1500px; overflow: hidden; background: #F5F6FD; font-family: 'DM Sans', system-ui, sans-serif; color: #141A46">
  <div aria-hidden="true" style="position: absolute; width: 360px; height: 360px; left: -150px; top: -140px; border-radius: 50%; background: #5B6CFF; opacity: 0.32; filter: blur(80px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; right: -170px; top: 700px; border-radius: 50%; background: #F0458A; opacity: 0.22; filter: blur(90px)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 60px 22px 40px 22px">
    <a href="#" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 16px 0 10px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.95); color: #3140D6; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Retour</a>
    <div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.1">Politique de confidentialité</h1>
      <p style="margin: 8px 0 0 0; font-size: 13px; color: #555B80">Dernière mise à jour : 28 août 2026</p>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #33395F">Futur Génie aide les enseignants à créer des devoirs à partir d’une photo de leçon. Cette page explique simplement quelles données sont utilisées, pourquoi, et pendant combien de temps.</p>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
      <section style="padding: 18px; border-radius: 22px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="flex: none; width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #E3E7FF, #FBE1EE); color: #3140D6; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px">{{s.n}}</div>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 17px">{{s.title}}</h2>
        </div>
        <sc-for list="{{s.items}}" as="it" hint-placeholder-count="2">
          <p style="margin: 0; padding-left: 14px; border-left: 2px solid #E3E7FF; font-size: 14px; line-height: 1.5; color: #33395F">{{it}}</p>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { n: '1', title: 'Ce que nous collectons sur l’enseignant', items: [
          'Adresse e-mail et mot de passe, pour la connexion au compte.',
          'Civilité, prénom et nom, pour identifier l’enseignant et afficher son nom aux élèves sur le devoir partagé.',
          'Nom et code postal de l’école, niveau de la classe, pour adapter l’application.',
          'Les devoirs créés, rattachés au compte pour pouvoir les retrouver et les partager.'
        ] },
        { n: '2', title: 'La photo de la leçon', items: [
          'Envoyée de façon sécurisée pour générer les questions, puis jamais conservée.',
          'Transmise à un prestataire d’intelligence artificielle (OpenAI) uniquement le temps de l’analyse.'
        ] },
        { n: '3', title: 'Ce que nous collectons sur les élèves', items: [
          'Aucun compte, aucune inscription : l’élève ouvre le lien et répond directement.',
          'Un prénom facultatif, jamais vérifié, pour que l’enseignant distingue les réponses.',
          'Réponses et score visibles uniquement par l’enseignant propriétaire du devoir.'
        ] },
        { n: '4', title: 'Ce que nous ne faisons pas', items: [
          'Pas de publicité, pas de revente de données.',
          'Pas de suivi publicitaire ni d’outil d’analyse tiers.',
          'Pas de nom de famille, date de naissance ou autre donnée identifiante sur les élèves.'
        ] },
        { n: '5', title: 'Où sont hébergées les données', items: [
          'Sur des serveurs Supabase situés dans l’Union européenne. Échanges chiffrés (HTTPS).'
        ] },
        { n: '6', title: 'Combien de temps', items: [
          'Aussi longtemps que le compte enseignant existe. La photo n’est jamais conservée.'
        ] },
        { n: '7', title: 'Vos droits', items: [
          'Suppression définitive du compte et des données depuis l’écran « Mon profil ».',
          'Une question ? contact@futurgenie.com'
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
