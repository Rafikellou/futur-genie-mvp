<!-- Supabase Auth "Reset password" template. Subject: Votre code pour changer de mot de passe – Futur Génie
     Uses the code ({{ .Token }}), not a link: the app's « Mot de passe oublié »
     screen asks for it. Paste into Dashboard > Authentication > Emails >
     Reset password (see supabase/README.md). -->
<div style="background:#F5F6FD;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:32px 28px;border:1px solid #DCE0F2;">
    <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#7B2FE0;">Futur Génie</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#141A46;">Votre code</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#33395F;">
      Saisissez ce code dans l'application pour choisir un nouveau mot de passe&nbsp;:
    </p>
    <p style="margin:0 0 24px;padding:16px;background:#F3ECFF;border-radius:14px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#141A46;">{{ .Token }}</p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#7A80A3;">
      Ce code est valable une heure. Vous n'avez pas demandé à changer de mot de passe&nbsp;? Ignorez simplement cet e-mail&nbsp;: votre mot de passe actuel reste inchangé.
    </p>
  </div>
</div>
